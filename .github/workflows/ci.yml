name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Install browser and font dependencies
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Browser smoke test against production build
        run: npm run test:ui
      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke
          retention-days: 3
          if-no-files-found: ignore
          path: work/ui/*.png
